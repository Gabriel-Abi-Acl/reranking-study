[project]
name = "reranking-study"
version = "0.1.0"
description = "Compare dense, BM25, hybrid RRF, and reranked retrieval pipelines for RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cross-encoder = ["sentence-transformers>=3.3.0"]
llm = ["openai>=1.55.0"]

[project.scripts]
evaluate-retrieval = "reranking_study.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
